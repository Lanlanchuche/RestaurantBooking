<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch Sử Đặt Bàn — TableReserve</title>
    <meta name="description" content="Quản lý và theo dõi lịch sử đặt bàn, trạng thái xác nhận và thực hiện hủy đặt chỗ theo quy tắc 24 giờ.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="app-body">
    <div class="app-shell">
        <header class="dash-header">
            <div class="dash-identity">
                <div id="dash-avatar" class="dash-avatar" aria-hidden="true">?</div>
                <div class="dash-identity-text">
                    <p class="dash-greet">Xin chào</p>
                    <h1 id="dash-user-name">Khách</h1>
                </div>
            </div>
            <button type="button" id="btn-logout" class="btn-ghost dash-logout">Đăng xuất</button>
        </header>

        <div class="dash-layout">
            <aside class="dash-sidebar" aria-label="Menu tài khoản">
                <a href="dashboard.html" class="dash-nav-btn">
                    Thông tin cá nhân
                </a>
                <a href="book.html" class="dash-nav-btn">
                    Đặt bàn
                </a>
                <a href="history.html" class="dash-nav-btn active" aria-current="page">
                    Lịch sử
                </a>
            </aside>

            <main class="dash-main">
                <div class="booking-hero-header" style="text-align:left; margin-bottom:24px;">
                    <h1 class="booking-hero-title">Lịch Sử Đặt Bàn</h1>
                    <p class="booking-hero-desc" style="margin:0;">
                        Theo dõi danh sách các lần đặt bàn, tình trạng phê duyệt từ nhà hàng và thực hiện hủy chỗ khi cần thiết.
                    </p>
                </div>

            <!-- Stats Bar -->
            <div class="history-stats-bar">
                <div class="history-stat-card">
                    <div id="stat-total" class="history-stat-val">0</div>
                    <p class="history-stat-label">Tổng lượt đặt</p>
                </div>
                <div class="history-stat-card">
                    <div id="stat-pending" class="history-stat-val" style="color:#b78103;">0</div>
                    <p class="history-stat-label">Chờ xác nhận</p>
                </div>
                <div class="history-stat-card">
                    <div id="stat-confirmed" class="history-stat-val" style="color:#2e7d32;">0</div>
                    <p class="history-stat-label">Đã xác nhận</p>
                </div>
                <div class="history-stat-card">
                    <div id="stat-cancelled" class="history-stat-val" style="color:var(--muted);">0</div>
                    <p class="history-stat-label">Đã hủy / Từ chối</p>
                </div>
            </div>

            <!-- Filter Navigation Tabs -->
            <nav class="history-filter-nav" aria-label="Lọc lịch sử đặt bàn">
                <button type="button" class="filter-tab-btn active" data-filter="ALL">Tất cả đặt bàn</button>
                <button type="button" class="filter-tab-btn" data-filter="PENDING">Chờ xác nhận</button>
                <button type="button" class="filter-tab-btn" data-filter="CONFIRMED">Đã xác nhận</button>
                <button type="button" class="filter-tab-btn" data-filter="CANCELLED">Đã hủy</button>
            </nav>

            <!-- Reservations List Container -->
            <section id="reservations-list-container" aria-label="Danh sách đặt bàn">
                <!-- Dynamic cards rendered by history.js -->
            </section>
            </main>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../js/auth.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/history.js"></script>
</body>

</html>
