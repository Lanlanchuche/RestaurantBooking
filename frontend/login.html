<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập — Restaurant Booking</title>
    <meta name="description" content="Đăng nhập để đặt bàn hoặc quản lý nhà hàng.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="page">
        <header class="header">
            <a class="logo" href="index.html">
                <span class="logo-mark" aria-hidden="true">🍽</span>
                <span>Restaurant Booking</span>
            </a>
            <nav class="nav-menu">
                <a href="index.html" class="btn-ghost">Trang chủ</a>
                <a href="register.html" class="btn-register">Đăng ký</a>
            </nav>
        </header>

        <main class="auth-wrapper">
            <section class="auth-card" aria-labelledby="login-title">
                <p class="hero-eyebrow">Chào mừng trở lại</p>
                <h1 id="login-title">Đăng nhập</h1>
                <p class="auth-lead">Nhập email và mật khẩu để đặt bàn hoặc quản lý nhà hàng.</p>

                <div id="login-error" class="form-alert" hidden role="alert"></div>

                <form id="login-form" novalidate>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input id="email" name="email" type="email" autocomplete="email" required placeholder="ban@email.com">
                    </div>

                    <div class="form-group">
                        <label for="password">Mật khẩu</label>
                        <div class="password-field">
                            <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="••••••••" minlength="6">
                            <button type="button" id="btn-toggle-password" class="btn-text" aria-pressed="false">Hiện</button>
                        </div>
                    </div>

                    <button type="submit" id="btn-login" class="btn-primary btn-block">Đăng nhập</button>
                </form>

                <p class="auth-footer">
                    Chưa có tài khoản? <a href="register.html">Đăng ký ngay</a>
                </p>
            </section>
        </main>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script src="js/login.js"></script>
</body>

</html>
